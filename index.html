<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Formulário de Inscrição</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="pic">
        <img src="assets/logo-padrao.png" alt="Logotipo Geração Tech 4.0">
    </div>
    
    <div class="title">
        <h2 style="text-align: center;">Formulário de Inscrição</h2>
    </div>

    <form>
        <div id="body">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name">
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br>
            <label for="message">Mensagem:</label>
            <textarea name="message" id="message" rows="10"></textarea>
            <br>
            <button type="submit" style="color: white; background: black; border: 2px;">Enviar</button>
        </div>
    </form>

    <div id="powered">
        <p style="text-align: center; ">Powered by Geração Tech 4.0 ®</p>
    </div>
</body>
</html>
